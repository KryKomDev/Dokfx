name: Release Template

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack Template
        run: |
          cd src/dokfx
          zip -r ../../dokfx-template.zip *
          cd ../..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dokfx-template.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
